<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | InfluencerLink</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="container">
        <nav class="navbar" style="border-bottom: none;">
            <a href="index.html" class="nav-brand">Influencer<span>Link</span></a>
            <div class="nav-links">
                <a href="features.html">Features</a>
                <a href="creators.html">Creators</a>
                <a href="brands.html">Brands</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-form">
            <h2>Welcome Back</h2>
            <p>Sign in to your premium account.</p>
            
            <form action="#" method="GET">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Log In</button>
            </form>
            
            <div class="auth-links">
                Don't have an account? <a href="signup.html">Create an account</a>
            </div>
        </div>
    </main>

</body>
</html>
