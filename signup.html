<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | InfluencerLink</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="container">
        <nav class="navbar" style="border-bottom: none;">
            <a href="index.html" class="nav-brand">Influencer<span>Link</span></a>
            <div class="nav-links">
                <a href="features.html">Features</a>
                <a href="creators.html">Creators</a>
                <a href="brands.html">Brands</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-form" style="padding-top: 2rem; padding-bottom: 2rem;">
            <h2>Request an Invite</h2>
            <p>Join our exclusive network of creators and brands.</p>
            
            <form action="#" method="GET">
                <div class="form-group">
                    <label for="name">Full Name or Company</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="account_type">Account Type</label>
                    <select id="account_type" name="account_type" required style="appearance: none; -webkit-appearance: none; -moz-appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill=\'%23D4AF37\' height=\'24\' viewBox=\'0 0 24 24\' width=\'24\' xmlns=\'http://www.w3.org/2000/svg\'><path d=\'M7 10l5 5 5-5z\'/><path d=\'M0 0h24v24H0z\' fill=\'none\'/></svg>'); background-repeat: no-repeat; background-position-x: 95%; background-position-y: center;">
                        <option value="" disabled selected>Select an account type</option>
                        <option value="creator">Creator</option>
                        <option value="brand">Brand</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Submit Request</button>
            </form>
            
            <div class="auth-links">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </main>

</body>
</html>
